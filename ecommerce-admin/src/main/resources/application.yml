spring:
  application:
    name: ecommerce-admin

  boot:
    admin:
      ui:
        title: 电商平台管理后台
      client:
        url: http://localhost:8090

  security:
    user:
      name: admin
      password: admin123

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        ip: 127.0.0.1

server:
  port: 8090

# 暴露所有 Actuator 端点供 Admin 展示
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
