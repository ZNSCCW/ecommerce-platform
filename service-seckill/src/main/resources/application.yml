spring:
  application:
    name: service-seckill
  boot:
    admin:
      client:
        url: http://localhost:8090

  datasource:
    url: jdbc:mysql://localhost:3306/db_seckill?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        ip: 127.0.0.1
    sentinel:
      transport:
        # dashboard 未部署，端口预留；注意别填 8080——那是网关的端口
        dashboard: localhost:8858

server:
  port: 8084

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

rocketmq:
  name-server: localhost:9876
  producer:
    group: seckill-producer-group
